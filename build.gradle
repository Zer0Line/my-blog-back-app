plugins {
    id 'java'
    id 'war'
}

group = 'com.training'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def props = new Properties()
file("src/main/resources/application.properties").withInputStream {
    props.load(it)
}
def tomcatHome = props.getProperty('tomcat.homepath')

ext {
    springVersion = '6.2.4'
    jakartaVersion = '6.0.0'
    lombokVersion = '1.18.30'
    tomcatName = 'ROOT'
    appName = project.name
}


dependencies {
    // Spring Web MVC
    implementation "org.springframework:spring-webmvc:${springVersion}"
    // Spring JDBC
    implementation "org.springframework:spring-jdbc:${springVersion}"

    // Servlet API
    implementation "jakarta.servlet:jakarta.servlet-api:${jakartaVersion}"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

    implementation 'com.h2database:h2:2.2.224'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('deploy', Copy) {
    dependsOn 'war'
    from war.archiveFile
    into "${tomcatHome}/webapps"
    rename { "${tomcatName}.war" }
}

// Дополнительная задача для удаления старого приложения
tasks.register('undeploy', Delete) {
    delete "${tomcatHome}/webapps/${tomcatName}.war"
    delete "${tomcatHome}/webapps/${tomcatName}"
}

// Объединенная задача для передеплоя
tasks.register('redeploy') {
    dependsOn 'war'
    group = 'deployment'
    description = 'Undeploy and deploy application to Tomcat'
    doLast {
        def warFile = file("${tomcatHome}/webapps/${tomcatName}.war")
        def appDir = file("${tomcatHome}/webapps/${tomcatName}")

        if (warFile.exists()) {
            delete warFile
        }
        if (appDir.exists()) {
            delete appDir
        }

        copy {
            from war.archiveFile
            into "${tomcatHome}/webapps"
            rename { "${tomcatName}.war" }
        }

        println "Deployed ROOT.war to Tomcat"
    }
}
